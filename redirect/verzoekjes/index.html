<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewijs dat je mens bent...</title>
</head>
<body>

    <h2>Om verder te gaan, bewijs dat je een mens bent.</h2>

    <img src="captcha.png" alt="Captcha" style="width: 400px; height: auto;">

    <br><br>

    <p>Voer de tekst uit de afbeelding in om te verifiëren.</p>
    <input type="text" id="verifyInput" placeholder="Typ hier...">
    <button id="verifyButton">Continue</button>

    <p id="errorMessage" style="color: red; display: none;">Incorrect. Probeer opniew. </p>


    <script>
        const finalDestination = "https://forms.gle/NWpPw54odLzGKPev8";
        const otherDestination = "https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1";
        const correctWord = "bobisnemiet";
        const otherWord = "toonisnemiet";

        // --- Get the HTML elements ---
        const inputField = document.getElementById("verifyInput");
        const aButton = document.getElementById("verifyButton");
        const aError = document.getElementById("errorMessage");

        // --- This function runs when the button is clicked ---
        function checkWord() {
            // Get the text, remove extra spaces, and make it lowercase
            let userText = inputField.value.replace(/\s+/g, '').toLowerCase();

            if (userText === correctWord) {
                // Success: Hide error and redirect
                aError.style.display = "none";
                window.location.href = finalDestination;
            } else if (userText === otherWord) {
                // Easter egg message
                aError.innerText = "Goed geprobeerd, Bob.";
                aError.style.display = "block";

                // Wait 1 second (1000ms) before redirecting
                setTimeout(function() {
                    window.location.href = otherDestination;
                }, 2000);
            } else {
                // Failure: Show error message
                aError.innerText = "Incorrect. Probeer opnieuw. Typ 'bobisnemiet' in het veld.";
                aError.style.display = "block";
            }
        }

        // --- Listen for events ---

        // 1. When the user clicks the button
        aButton.addEventListener("click", checkWord);

        // 2. (Optional) When the user presses "Enter" in the text box
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkWord();
            }
        });
    </script>

</body>
</html>
